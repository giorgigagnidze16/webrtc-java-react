<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Connect - Enterprise Communication</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #3b82f6;
            --success: #059669;
            --success-light: #10b981;
            --danger: #dc2626;
            --danger-light: #ef4444;
            --warning: #d97706;
            --gray-50: #f9fafb;
            --gray-100: #f3f4f6;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-500: #6b7280;
            --gray-600: #4b5563;
            --gray-700: #374151;
            --gray-800: #1f2937;
            --gray-900: #111827;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--gray-100);
            min-height: 100vh;
            color: var(--gray-800);
            line-height: 1.5;
        }

        .app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        .header {
            background: white;
            border-bottom: 1px solid var(--gray-200);
            padding: 16px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-logo {
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .header-logo .material-icons {
            font-size: 24px;
        }

        .header-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .header-subtitle {
            font-size: 0.75rem;
            color: var(--gray-500);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .header-status {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--gray-50);
            border-radius: 20px;
            font-size: 0.875rem;
        }

        .header-status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--gray-400);
        }

        .header-status-dot.connected {
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.2);
        }

        .header-status-dot.connecting {
            background: var(--warning);
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 32px 24px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        /* Cards */
        .card {
            background: white;
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--gray-200);
            overflow: hidden;
        }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--gray-100);
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray-900);
        }

        .card-body {
            padding: 24px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-700);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-300);
            border-radius: 8px;
            font-size: 0.9375rem;
            color: var(--gray-900);
            background: white;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .form-input::placeholder {
            color: var(--gray-400);
        }

        .form-input:disabled {
            background: var(--gray-50);
            color: var(--gray-500);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 0.9375rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn .material-icons {
            font-size: 20px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-dark);
        }

        .btn-success {
            background: var(--success);
            color: white;
        }

        .btn-success:hover:not(:disabled) {
            background: #047857;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #b91c1c;
        }

        .btn-secondary {
            background: var(--gray-100);
            color: var(--gray-700);
            border: 1px solid var(--gray-300);
        }

        .btn-secondary:hover:not(:disabled) {
            background: var(--gray-200);
        }

        .btn-secondary.active {
            background: var(--gray-700);
            color: white;
            border-color: var(--gray-700);
        }

        .btn-lg {
            padding: 14px 28px;
            font-size: 1rem;
        }

        .btn-block {
            width: 100%;
        }

        /* Call Controls */
        .call-controls {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 24px;
        }

        .call-controls.visible {
            display: grid;
        }

        /* Status Panel */
        .status-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .status-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--gray-50);
            border-radius: 8px;
        }

        .status-item-label {
            font-size: 0.875rem;
            color: var(--gray-500);
        }

        .status-item-value {
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--gray-900);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-item-value .material-icons {
            font-size: 18px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8125rem;
            font-weight: 500;
        }

        .status-badge-success {
            background: rgba(5, 150, 105, 0.1);
            color: var(--success);
        }

        .status-badge-warning {
            background: rgba(217, 119, 6, 0.1);
            color: var(--warning);
        }

        .status-badge-danger {
            background: rgba(220, 38, 38, 0.1);
            color: var(--danger);
        }

        .status-badge-neutral {
            background: var(--gray-100);
            color: var(--gray-600);
        }

        /* Audio Visualizer */
        .audio-visualizer {
            height: 48px;
            background: var(--gray-50);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            margin-top: 24px;
        }

        .audio-bar {
            width: 3px;
            height: 8px;
            background: var(--gray-300);
            border-radius: 2px;
            transition: height 0.1s ease;
        }

        .audio-visualizer.active .audio-bar {
            background: var(--primary);
            animation: audioWave 0.6s ease-in-out infinite;
        }

        @keyframes audioWave {
            0%, 100% { height: 8px; }
            50% { height: 32px; }
        }

        .audio-bar:nth-child(1) { animation-delay: 0s; }
        .audio-bar:nth-child(2) { animation-delay: 0.1s; }
        .audio-bar:nth-child(3) { animation-delay: 0.2s; }
        .audio-bar:nth-child(4) { animation-delay: 0.15s; }
        .audio-bar:nth-child(5) { animation-delay: 0.25s; }
        .audio-bar:nth-child(6) { animation-delay: 0.05s; }
        .audio-bar:nth-child(7) { animation-delay: 0.3s; }
        .audio-bar:nth-child(8) { animation-delay: 0.12s; }
        .audio-bar:nth-child(9) { animation-delay: 0.18s; }
        .audio-bar:nth-child(10) { animation-delay: 0.08s; }
        .audio-bar:nth-child(11) { animation-delay: 0.22s; }
        .audio-bar:nth-child(12) { animation-delay: 0.14s; }

        /* Right Column */
        .right-column {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Activity Log */
        .log-panel {
            max-height: 300px;
            overflow-y: auto;
        }

        .log-entry {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid var(--gray-100);
            font-size: 0.8125rem;
        }

        .log-entry:last-child {
            border-bottom: none;
        }

        .log-time {
            color: var(--gray-400);
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.75rem;
            white-space: nowrap;
        }

        .log-message {
            color: var(--gray-600);
            flex: 1;
        }

        .log-message.success { color: var(--success); }
        .log-message.error { color: var(--danger); }
        .log-message.info { color: var(--primary); }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--gray-500);
        }

        /* Animations */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Hidden Elements */
        audio {
            display: none;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                padding: 16px;
            }

            .header {
                padding: 12px 16px;
            }

            .header-subtitle {
                display: none;
            }

            .call-controls {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <header class="header">
            <div class="header-brand">
                <div class="header-logo">
                    <span class="material-icons">headset_mic</span>
                </div>
                <div>
                    <div class="header-title">Voice Connect</div>
                    <div class="header-subtitle">Enterprise Communication</div>
                </div>
            </div>
            <div class="header-status">
                <span class="header-status-dot" id="connectionDot"></span>
                <span id="connectionStatus">Offline</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Left Column - Conference Setup -->
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title">Conference Room</h2>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label class="form-label" for="roomId">Room ID</label>
                        <input type="text" id="roomId" class="form-input" placeholder="Enter conference room ID..." value="room-1">
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="userId">Display Name</label>
                        <input type="text" id="userId" class="form-input" placeholder="Enter your name...">
                    </div>

                    <button id="joinBtn" class="btn btn-primary btn-lg btn-block">
                        <span class="material-icons">login</span>
                        Join Room
                    </button>

                    <div class="call-controls" id="callControls">
                        <button id="callBtn" class="btn btn-success" disabled>
                            <span class="material-icons">phone</span>
                            Call
                        </button>
                        <button id="muteBtn" class="btn btn-secondary" disabled>
                            <span class="material-icons">mic</span>
                            Mute
                        </button>
                        <button id="hangupBtn" class="btn btn-danger" disabled>
                            <span class="material-icons">call_end</span>
                            End
                        </button>
                    </div>

                    <!-- Audio Visualizer -->
                    <div class="audio-visualizer" id="audioVisualizer">
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                        <div class="audio-bar"></div>
                    </div>
                </div>
            </div>

            <!-- Right Column - Status & Logs -->
            <div class="right-column">
                <!-- Status Card -->
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Session Status</h2>
                    </div>
                    <div class="card-body">
                        <div class="status-list">
                            <div class="status-item">
                                <span class="status-item-label">Connection</span>
                                <span class="status-item-value" id="statusConnection">
                                    <span class="status-badge status-badge-neutral">Disconnected</span>
                                </span>
                            </div>
                            <div class="status-item">
                                <span class="status-item-label">Room</span>
                                <span class="status-item-value" id="roomStatus" style="color: var(--gray-400)">Not joined</span>
                            </div>
                            <div class="status-item">
                                <span class="status-item-label">Participant</span>
                                <span class="status-item-value" id="peerStatus" style="color: var(--gray-400)">None</span>
                            </div>
                            <div class="status-item">
                                <span class="status-item-label">Call Status</span>
                                <span class="status-item-value" id="statusCall">
                                    <span class="status-badge status-badge-neutral">Idle</span>
                                </span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Activity Log Card -->
                <div class="card" style="flex: 1;">
                    <div class="card-header">
                        <h2 class="card-title">Activity Log</h2>
                    </div>
                    <div class="card-body">
                        <div class="log-panel" id="logPanel">
                            <div class="empty-state">
                                <p>No activity yet</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Hidden audio element for remote stream -->
        <audio id="remoteAudio" autoplay></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
